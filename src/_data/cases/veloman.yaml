slug: veloman
lang: ru
title: veloman.by
subtitle: Интернет-магазин велосипедов с нуля
period: ноябрь 2023 — март 2024
period_html: "2023-11/2024-03"
role: Единственный frontend-разработчик
stack:
  - Vue 3
  - Nuxt 3
  - TypeScript
  - Pinia
  - Sass
summary: >-
  Полный редизайн магазина: от макетов Figma до production-сборки, в одиночку.
context: >-
  Магазин велосипедов с несколькими сотнями моделей. Старая версия сайта не
  обновлялась годами: тяжёлые страницы, неудобный каталог, нет нормальной
  мобильной версии.
constraints:
  - Фронтенд-разработчик один — весь интерфейс на одном человеке.
  - Макеты в Figma с требованием pixel-perfect.
  - Нужен SSR: каталог должен индексироваться поисковиками.
decisions:
  - title: Корзина и избранное на Pinia с синхронизацией в localStorage и cookies
    options:
      - Только localStorage
      - Только cookies
      - Pinia как источник правды, оба хранилища как транспорт
    choice: Pinia + localStorage + cookies
    why: >-
      SSR не видит localStorage: серверный рендер должен знать о корзине
      из cookies, а клиент хочет мгновенную работу без сети.
    cost: >-
      Два хранилища нужно синхронизировать, и это отдельный источник ошибок.
  - title: SEO через SSR и структурированные данные
    options:
      - Клиентский рендер
      - SSR без разметки
      - SSR + Schema.org
    choice: SSR + JSON-LD для товаров и отзывов
    why: >-
      Магазин живёт органическим трафиком: без корректной разметки карточки
      не попадают в расширенные сниппеты.
    cost: >-
      Каждая страница обязана отдавать метатеги, и это нельзя забыть при
      добавлении нового типа страницы.
  - title: Скорость за счёт разделения кода
    options:
      - Один бандл
      - Разделение по маршрутам
      - Разделение по маршрутам + ленивые медиа
    choice: Разделение по маршрутам и ленивая загрузка медиа
    why: >-
      Главная страница тянула на себя код карточки товара и галерей, которые
      нужны не сразу.
    cost: >-
      Появились переходы с подгрузкой — их пришлось делать незаметными.
metrics:
