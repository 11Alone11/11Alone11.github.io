slug: abw
title: abw.by
subtitle: Маркетплейс автомобилей
period: ноябрь 2024 — октябрь 2025
role: Frontend-разработчик
url: "https://abw.by"
cover: "/img/cases/abw/home.webp"
cover_alt: "Главная abw.by: поиск автомобилей и подборки"
stack:
  - Vue 3
  - Nuxt
  - TypeScript
  - Pinia
  - Vite
summary: >-
  Перевёл платформу с JavaScript на TypeScript, обновил Nuxt и переписал работу
  с данными: фильтры, подача объявлений, Core Web Vitals.
context: >-
  Крупная площадка объявлений об автомобилях. Кодовая база росла несколько лет
  на JavaScript, интерфейс собирался из разнородных блоков, а скорость страниц
  держалась на кэшировании. Задача — привести проект к современному состоянию,
  не останавливая продукт.
constraints:
  - Продукт в продакшене, релизы каждую неделю — переписывать целиком нельзя.
  - Legacy-код на JavaScript без типов и тестов.
  - Дизайн-системы нет, компоненты дублируются между разделами.
decisions:
  - title: Миграция с JavaScript на TypeScript и с Nuxt 3 на Nuxt 4
    options:
      - Переписать разделы с нуля
      - Постепенная миграция по разделам
      - Оставить JS
    choice: "Постепенная миграция: сначала типы в общих модулях, потом разделы"
    why: >-
      Полный рефакторинг остановил бы продукт на месяцы, а точечная типизация даёт
      эффект сразу и не блокирует релизы.
    cost: >-
      Какое-то время в проекте живут два стиля, и это приходится объяснять на ревью.
  - title: Переписал фильтрацию и поиск с состоянием в URL
    options:
      - Хранить фильтры в Pinia
      - Хранить в URL
      - Гибрид
    choice: URL как источник правды, Pinia — производное состояние
    why: >-
      Ссылкой на подборку можно поделиться, а обновление страницы не сбрасывает
      выбор пользователя.
    cost: >-
      Синхронизация требует аккуратности: каждый параметр должен иметь дефолт
      и правило нормализации.
  - title: Сжал критический путь загрузки
    options:
      - Оставить как есть
      - Оптимизировать изображения и кэш
      - Переписать рендер
    choice: Изображения первого экрана и кэширование статики
    why: >-
      Основной вес страницы — картинки объявлений, а не JavaScript. Самое дешёвое
      изменение с самым заметным эффектом.
    cost: >-
      Появились правила по размерам изображений, которые нужно соблюдать всем, кто
      добавляет новые блоки.
metrics:
  - label: LCP
    before: 2,4 с
    after: 1,5 с
    method: загрузка изображений первого экрана и кэширование статических ресурсов
    source: резюме, ноябрь 2026 — раздел «Бонусторг», пункт про LCP и CLS
  - label: Переиспользуемые UI-компоненты
    after: 30+
    method: вынесены в общую библиотеку проекта
    source: резюме, ноябрь 2026 — раздел «Бонусторг»
  - label: Разделы
    after: 5 новых, 7 доработано
    method: включая многошаговую подачу объявления
    source: резюме, ноябрь 2026 — раздел «Бонусторг»
