slug: beerzhevik
lang: ru
title: БИРЖЕВИК
subtitle: PWA с ценами в реальном времени
period: март — октябрь 2024
period_html: "2024-03/2024-10"
role: Frontend-разработчик
stack:
  - TypeScript
  - Vue 3
  - Nuxt 3
  - Pinia
  - Chart.js
  - WebSocket
summary: >-
  Мобильное приложение для бара: гости и персонал видят цены на позиции меню,
  которые меняются в зависимости от спроса.
context: >-
  Платформа для бара с «биржевыми» ценами: чем выше спрос на позицию, тем дороже
  она становится. Интерфейсом пользуются и гости за столиком, и персонал за стойкой.
constraints:
  - Цены должны обновляться без перезагрузки страницы и без заметной задержки.
  - "Три роли с разными сценариями: администратор, официант, посетитель."
  - Интерфейс живёт на смартфонах и на телевизорах — разные размеры и способы ввода.
decisions:
  - title: Обновление цен по WebSocket вместо опроса
    options:
      - Периодический запрос каждые N секунд
      - Server-Sent Events
      - WebSocket
    choice: WebSocket
    why: >-
      Данные меняются неравномерно и часто — опрос создавал бы лишнюю нагрузку
      и задержку до N секунд.
    cost: >-
      Нужно переподключение и разбор состояний: соединение может упасть,
      а интерфейс не должен показывать устаревшие цены как актуальные.
  - title: Авторизация на JWT и сценарии для трёх ролей
    options:
      - Один интерфейс для всех
      - Разные приложения под роли
      - Один интерфейс с ролевой моделью
    choice: Один интерфейс, разные сценарии
    why: >-
      Три отдельных приложения — это три кодовые базы и три релиза. Роли
      различаются доступными действиями, а не структурой экрана.
    cost: >-
      Ветвление в компонентах и более сложные проверки прав.
  - title: Интерфейс под два совершенно разных экрана
    options:
      - Только мобильный
      - Мобильный и адаптированный десктоп
      - Мобильный и отдельный режим для ТВ
    choice: Отдельный режим для ТВ, а не «растянутый» мобильный
    why: >-
      На телевизоре нет курсора и другой угол обзора: нужны крупные элементы
      и навигация с пульта.
    cost: >-
      Два набора стилей и больше ручной проверки на реальных устройствах.
metrics:
