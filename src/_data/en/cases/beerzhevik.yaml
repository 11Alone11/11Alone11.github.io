slug: beerzhevik
lang: en
title: Beerzhevik
subtitle: Real-time pricing PWA
period: March — October 2024
role: Frontend Developer
stack:
  - TypeScript
  - Vue 3
  - Nuxt 3
  - Pinia
  - Chart.js
  - WebSocket
summary: >-
  A mobile app for a bar: guests and staff see menu prices that change with demand.
context: >-
  A bar platform with exchange-like pricing: the higher the demand for an item, the
  more it costs. The interface is used both by guests at the table and by staff
  behind the bar.
constraints:
  - Prices must update without a reload and without noticeable delay.
  - Three roles with different flows: administrator, waiter, guest.
  - The UI lives on phones and TVs — different sizes and input methods.
decisions:
  - title: Price updates over WebSocket instead of polling
    options:
      - Poll every N seconds
      - Server-Sent Events
      - WebSocket
    choice: WebSocket
    why: >-
      Data changes unevenly and often — polling would add load and up to N seconds
      of latency.
    cost: >-
      Reconnection and state handling: the connection can drop, and the UI must not
      present stale prices as current.
  - title: JWT authentication and flows for three roles
    options:
      - One interface for everyone
      - Separate apps per role
      - One interface with a role model
    choice: One interface, different flows
    why: >-
      Three apps mean three codebases and three releases. Roles differ in available
      actions, not in screen structure.
    cost: >-
      Conditional logic inside components and more involved permission checks.
  - title: An interface for two very different screens
    options:
      - Mobile only
      - Mobile and an adapted desktop
      - Mobile and a dedicated TV mode
    choice: A dedicated TV mode instead of a stretched mobile layout
    why: >-
      A TV has no cursor and a different viewing distance: large elements and
      remote-friendly navigation are required.
    cost: >-
      Two sets of styles and more manual testing on real devices.
