slug: veloman
lang: en
title: veloman.by
subtitle: Bike store built from scratch
period: November 2023 — March 2024
role: Sole frontend developer
stack:
  - Vue 3
  - Nuxt 3
  - TypeScript
  - Pinia
  - Sass
summary: >-
  A full store redesign: from Figma files to the production build, solo.
context: >-
  A bike shop with several hundred models. The old site had not been updated for
  years: heavy pages, an awkward catalogue, no proper mobile version.
constraints:
  - One frontend developer — the whole interface on a single person.
  - Figma designs with a pixel-perfect requirement.
  - SSR was mandatory: the catalogue has to be indexable.
decisions:
  - title: Cart and wishlist in Pinia, synced to localStorage and cookies
    options:
      - localStorage only
      - cookies only
      - Pinia as the source of truth, both storages as transport
    choice: Pinia + localStorage + cookies
    why: >-
      SSR cannot see localStorage: the server render needs to know about the cart
      from cookies, while the client wants instant work without the network.
    cost: >-
      Two storages have to be kept in sync, and that is a separate source of bugs.
  - title: SEO through SSR and structured data
    options:
      - Client-side rendering
      - SSR without markup
      - SSR + Schema.org
    choice: SSR + JSON-LD for products and reviews
    why: >-
      The store lives on organic traffic: without proper markup, product pages miss
      rich snippets.
    cost: >-
      Every page must emit meta tags, and that cannot be forgotten when a new page
      type is added.
  - title: Speed through code splitting
    options:
      - One bundle
      - Route-based splitting
      - Route-based splitting + lazy media
    choice: Route-based splitting and lazy media loading
    why: >-
      The home page pulled in the product page and gallery code that is not needed
      right away.
    cost: >-
      Transitions with loading appeared — they had to be made invisible.
